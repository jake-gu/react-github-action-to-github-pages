# 一个简单的 GitHub Pages 部署工作流
name: Deploy static content to Pages

on:
  # 仅在推送到默认分支时运行
  push:
    branches: ['main']

  # 允许手动在 Actions 页面触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 使用官方新的 pnpm/setup 同时搞定 Node.js、pnpm 及缓存
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 9
          runtime: node@lts/*   # 或指定版本，如 node@22
          cache: true           # 自动开启依赖缓存

      # 严格按 lockfile 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 打包构建
      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传构建输出目录：常规 Vite 为 './dist'；如果是 VitePress 文档则改为 './.vitepress/dist'
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4