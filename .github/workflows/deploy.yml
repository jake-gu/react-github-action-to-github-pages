# 一个简单的 GitHub Pages 部署工作流
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 升级 checkout 到 v5 / 最新版本
      - name: Checkout
        uses: actions/checkout@v5

      # 2. 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. 设置 Node.js
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # 4. 升级 configure-pages 到 v6
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 5. 升级 upload-pages-artifact 到 v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      # 6. 升级 deploy-pages 到 v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5